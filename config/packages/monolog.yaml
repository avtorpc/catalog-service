monolog:
    channels:
        - deprecation
        - api

############################################
# DEV ENVIRONMENT
############################################
when@dev:
    monolog:
        handlers:

            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

            api:
                type: stream
                path: "%kernel.logs_dir%/api.log"
                level: debug
                channels: ["api"]

############################################
# TEST ENVIRONMENT
############################################
when@test:
    monolog:
        handlers:

            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]

            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

            api:
                type: stream
                path: "%kernel.logs_dir%/api_test.log"
                level: error
                channels: ["api"]

############################################
# PRODUCTION ENVIRONMENT
############################################
when@prod:
    monolog:
        handlers:

            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50

            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            api:
                type: stream
                path: php://stderr
                level: error
                channels: ["api"]
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

            deprecation:
                type: stream
                channels: ["deprecation"]
                path: php://stderr
                formatter: monolog.formatter.json
